<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1830"/>
      <stop offset="50%" stop-color="#120e1f"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>

    <linearGradient id="logoBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff9900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="logoPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="45%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>

    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Group (scaled from 512 to 144) -->
  <g transform="translate(18, 18) scale(0.28)">
    <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#logoBgGrad)" stroke="url(#logoBorderGlow)" stroke-width="6" />
    <!-- C Ring -->
    <path d="M 330 145 C 295 120, 245 110, 195 130 C 130 155, 95 220, 95 290 C 95 365, 145 425, 225 435 C 290 445, 345 415, 380 375 L 325 330 C 305 352, 270 368, 230 362 C 180 355, 155 315, 155 275 C 155 230, 180 185, 230 175 C 265 168, 298 180, 318 198 Z" fill="url(#logoPlayGrad)" />
    <!-- Play Triangle -->
    <path d="M 235 185 L 395 275 L 235 365 Z" fill="url(#logoPlayGrad)" />
    <!-- Perforations -->
    <circle cx="190" cy="205" r="9" fill="white" fill-opacity="0.85" />
    <circle cx="190" cy="240" r="9" fill="white" fill-opacity="0.85" />
    <circle cx="190" cy="275" r="9" fill="white" fill-opacity="0.85" />
    <circle cx="190" cy="310" r="9" fill="white" fill-opacity="0.85" />
    <circle cx="190" cy="345" r="9" fill="white" fill-opacity="0.85" />
  </g>

  <!-- Typography: Cine (White) + BG (Vibrant Amber Gradient) -->
  <text x="180" y="116" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-2">
    Cine<tspan fill="url(#logoPlayGrad)" dx="2">BG</tspan>
  </text>

  <!-- Subtitle: STREAMING PREMIUM -->
  <text x="184" y="148" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ff9100" letter-spacing="8" opacity="0.9">
    STREAMING
  </text>
</svg>
