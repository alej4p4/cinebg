<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1830"/>
      <stop offset="50%" stop-color="#120e1f"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff9900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Main Emblem Gradient (YuCine style Hot Red to Gold) -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="45%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ff1744" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="4" />

  <!-- Ambient Light Reflection -->
  <path d="M 40 126 C 40 76, 76 40, 126 40 L 386 40 C 436 40, 472 76, 472 126 C 472 170, 350 200, 256 200 C 140 200, 40 170, 40 126 Z" fill="white" fill-opacity="0.05" />

  <!-- Stylized CineBG 'C' Ring with Play Aperture -->
  <g filter="url(#dropShadow)">
    <!-- Outer Arc of C -->
    <path d="M 330 145 C 295 120, 245 110, 195 130 C 130 155, 95 220, 95 290 C 95 365, 145 425, 225 435 C 290 445, 345 415, 380 375 L 325 330 C 305 352, 270 368, 230 362 C 180 355, 155 315, 155 275 C 155 230, 180 185, 230 175 C 265 168, 298 180, 318 198 Z" fill="url(#playGrad)" />

    <!-- Dynamic 3D Play Triangle pointing forward (YuCine style) -->
    <path d="M 235 185 L 395 275 L 235 365 Z" fill="url(#playGrad)" filter="url(#glow)" />
    <path d="M 235 185 L 395 275 L 285 275 Z" fill="url(#accentGrad)" fill-opacity="0.45" />
  </g>

  <!-- Sleek Cine Film Strip Perforations -->
  <circle cx="190" cy="205" r="8" fill="white" fill-opacity="0.8" />
  <circle cx="190" cy="240" r="8" fill="white" fill-opacity="0.8" />
  <circle cx="190" cy="275" r="8" fill="white" fill-opacity="0.8" />
  <circle cx="190" cy="310" r="8" fill="white" fill-opacity="0.8" />
  <circle cx="190" cy="345" r="8" fill="white" fill-opacity="0.8" />

  <!-- Monogram 'BG' Badge in Golden Amber -->
  <g transform="translate(300, 350)">
    <rect width="130" height="52" rx="16" fill="#181324" stroke="url(#accentGrad)" stroke-width="2.5" />
    <text x="65" y="37" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="30" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="2">BG</text>
  </g>
</svg>
