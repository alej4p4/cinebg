name: CI — Qualidade, Arquitetura, Observabilidade & Testes

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'improvement/**']
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Architectural Contract (ArchUnit / Arch-Contract)
        run: npm run test:arch

      - name: Run Unit & Integration Tests
        run: npm run test:unit

      - name: Build Production Bundle (TypeScript & Vite)
        run: npm run build

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
