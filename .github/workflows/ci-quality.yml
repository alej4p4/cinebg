name: CI — Qualidade, Arquitetura, Observabilidade, Testes & E2E

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'improvement/**']
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Architectural Contract (ArchUnit / Arch-Contract)
        run: npm run test:arch

      - name: Run Unit & Integration Tests with Coverage
        run: npm run test:unit -- --experimental-vm-modules 2>&1 | tee test-output.txt

      - name: Build Production Bundle (TypeScript & Vite)
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || '4e44d9029b1270a757cddc766a1bcb63' }}
        run: npm run build

      - name: Run E2E Tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: true

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  mutation-testing:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Mutation Tests (Stryker)
        run: npm run test:mutation
        timeout-minutes: 15

      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: stryker-report/
          retention-days: 7