name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-cinebg123}"
          ALIAS="${KEY_ALIAS:-cinebg}"
          KEY_PASS="${KEY_PASSWORD:-cinebg123}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando keystore de produção a partir dos secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/cinebg-release.jks
          elif [ ! -f android/cinebg-release.jks ]; then
            echo "KEYSTORE_BASE64 não configurado e arquivo não existe. Gerando keystore de release nova..."
            keytool -genkey -v -keystore android/cinebg-release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=CineBG, OU=Mobile, O=BarraSoft, L=Default, S=Default, C=BR"
          else
            echo "Usando keystore de release existente no repositorio..."
          fi

          printf "storeFile=cinebg-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASS" "$ALIAS" "$KEY_PASS" > android/keystore.properties

      - name: Assemble Mobile Release APK
        run: cd android && ./gradlew assembleMobileRelease --no-daemon

      - name: Assemble TV Release APK
        run: cd android && ./gradlew assembleTvRelease --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/mobile/release/CineBG-Mobile-release.apk
            android/app/build/outputs/apk/tv/release/CineBG-Tv-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
