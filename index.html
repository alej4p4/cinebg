<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="CineBG — Filmes, Séries e Anime em streaming" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap"
      />
    </noscript>
    <title>CineBG — Streaming</title>
  </head>
  <body>
    <div id="root">
      <div id="cinebg-boot-loader" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;background:#08070d;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;z-index:99999;">
        <div style="font-size:2.5rem;font-weight:900;letter-spacing:-0.05em;color:#e50914;margin-bottom:1.5rem;">CineBG</div>
        <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top-color:#e50914;border-radius:50%;animation:cinebg-spin 0.8s linear infinite;"></div>
        <style>@keyframes cinebg-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
